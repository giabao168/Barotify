<svg xmlns="http://www.w3.org/2000/svg" width="880" height="128" viewBox="0 0 880 128" role="img" aria-label="256 kbps Opus and AAC streams, 10-band equalizer, 12 romanized languages, 256 MB Lite heap">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1B20"/>
      <stop offset="1" stop-color="#0E0F12"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3AD0FF"/>
      <stop offset="0.55" stop-color="#7A5CFF"/>
      <stop offset="1" stop-color="#FF9A3C"/>
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="127" rx="14" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity="0.12"/>
  <rect x="1" y="1" width="878" height="126" rx="13.5" fill="url(#grid)"/>
  <rect x="24" y="0" width="832" height="2" fill="url(#rim)"/>
  <g stroke="#FFFFFF" stroke-opacity="0.1">
    <line x1="220" y1="28" x2="220" y2="100"/>
    <line x1="440" y1="28" x2="440" y2="100"/>
    <line x1="660" y1="28" x2="660" y2="100"/>
  </g>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#FFFFFF" text-anchor="middle">
    <text x="110" y="66" font-size="30" font-weight="600">256<tspan font-size="16" fill-opacity="0.6" dx="4">kbps</tspan></text>
    <text x="330" y="66" font-size="30" font-weight="600">10<tspan font-size="16" fill-opacity="0.6" dx="4">bands</tspan></text>
    <text x="550" y="66" font-size="30" font-weight="600">12<tspan font-size="16" fill-opacity="0.6" dx="4">languages</tspan></text>
    <text x="770" y="66" font-size="30" font-weight="600">256<tspan font-size="16" fill-opacity="0.6" dx="4">MB</tspan></text>
  </g>
  <g font-family="'SF Mono', 'Cascadia Code', Consolas, Menlo, monospace" font-size="11" letter-spacing="1.5" fill="#9AA3B2" text-anchor="middle">
    <text x="110" y="92">OPUS · AAC STREAMS</text>
    <text x="330" y="92">EQ · AUTOEQ PROFILES</text>
    <text x="550" y="92">LYRICS ROMANIZATION</text>
    <text x="770" y="92">LITE JVM HEAP</text>
  </g>
</svg>
